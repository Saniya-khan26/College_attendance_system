{% extends "base.html" %}

{% block title %}
Add Class
{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2>🏫 Add Class</h2>

                    <p class="text-muted">
                        Create a new class
                    </p>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">

                        <!-- Class ID -->
                        <div class="mb-3">

                            <label class="form-label">
                                Class ID
                            </label>

                            <input
                                type="text"
                                name="class_id"
                                class="form-control"
                                placeholder="BCA-5-A-2026"
                                required
                            >

                        </div>

                        <!-- Course -->
                        <div class="mb-3">

                            <label class="form-label">
                                Course
                            </label>

                            <select
                                name="course"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Course
                                </option>

                                <option value="BCA">
                                    BCA
                                </option>

                                <option value="BBA">
                                    BBA
                                </option>

                                <option value="BCom">
                                    BCom
                                </option>

                                <option value="BA">
                                    BA
                                </option>

                                <option value="BSc">
                                    BSc
                                </option>

                            </select>

                        </div>

                        <!-- Semester -->
                        <div class="mb-3">

                            <label class="form-label">
                                Semester
                            </label>

                            <select
                                name="semester"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Semester
                                </option>

                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>

                            </select>

                        </div>

                        <!-- Division -->
                        <div class="mb-3">

                            <label class="form-label">
                                Division
                            </label>

                            <select
                                name="division"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Division
                                </option>

                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>

                            </select>

                        </div>

                        <!-- Academic Year -->
                        <div class="mb-3">

                            <label class="form-label">
                                Academic Year
                            </label>

                            <input
                                type="text"
                                name="academic_year"
                                class="form-control"
                                placeholder="2026-27"
                                required
                            >

                        </div>

                        <!-- Faculty -->
                        <div class="mb-3">

                            <label class="form-label">
                                Class Teacher
                            </label>

                            <select
                                name="teacher_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Faculty
                                </option>

                                {% for teacher in faculty_list %}

                                <option value="{{ teacher.faculty_id }}">
                                    {{ teacher.name }}
                                    — {{ teacher.faculty_id }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="d-flex gap-2">

                            <a
                                href="{{ url_for('classes') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Class
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
