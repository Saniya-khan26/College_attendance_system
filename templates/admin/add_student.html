{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-7">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2 class="mb-1">👨‍🎓 Add Student</h2>

                    <p class="text-muted mb-4">
                        Add a new student to the attendance system
                    </p>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Student ID
                                </label>

                                <input
                                    type="text"
                                    name="student_id"
                                    class="form-control"
                                    placeholder="STU001"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Roll Number
                                </label>

                                <input
                                    type="number"
                                    name="roll_no"
                                    class="form-control"
                                    placeholder="1"
                                    required
                                >
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Student Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter full name"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="student@example.com"
                                required
                            >
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Course
                                </label>

                                <select
                                    name="course"
                                    class="form-select"
                                    required
                                >
                                    <option value="">
                                        Select Course
                                    </option>

                                    <option value="BCA">
                                        BCA
                                    </option>

                                    <option value="BBA">
                                        BBA
                                    </option>

                                    <option value="BCom">
                                        BCom
                                    </option>

                                    <option value="BA">
                                        BA
                                    </option>

                                    <option value="BSc">
                                        BSc
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Semester
                                </label>

                                <select
                                    name="semester"
                                    class="form-select"
                                    required
                                >
                                    <option value="">
                                        Select Semester
                                    </option>

                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>

                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Division
                                </label>

                                <select
                                    name="division"
                                    class="form-select"
                                    required
                                >
                                    <option value="">
                                        Select Division
                                    </option>

                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Academic Year
                                </label>

                                <input
                                    type="text"
                                    name="academic_year"
                                    class="form-control"
                                    value="2026-27"
                                    required
                                >

                            </div>

                        </div>


                        <!-- CLASS -->
                        <div class="mb-3">

                            <label class="form-label">
                                🏫 Class
                            </label>

                            <select
                                name="class_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Class
                                </option>

                                {% for class_item in classes %}

                                <option value="{{ class_item.class_id }}">
                                    {{ class_item.class_id }}
                                    — {{ class_item.course }}
                                    — Semester {{ class_item.semester }}
                                    — Division {{ class_item.division }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="d-flex gap-2 mt-3">

                            <a
                                href="{{ url_for('students') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Student
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
