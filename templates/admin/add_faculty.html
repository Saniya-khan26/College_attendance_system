{% extends "base.html" %}

{% block title %}
Add Faculty
{% endblock %}

{% block content %}

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2>👩‍🏫 Add Faculty</h2>

                    <p class="text-muted">
                        Add a faculty member
                    </p>

                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Faculty ID
                            </label>

                            <input
                                type="text"
                                name="faculty_id"
                                class="form-control"
                                placeholder="FAC001"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter faculty name"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="faculty@example.com"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                placeholder="Computer Science"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Designation
                            </label>

                            <select
                                name="designation"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Designation
                                </option>

                                <option value="Professor">
                                    Professor
                                </option>

                                <option value="Associate Professor">
                                    Associate Professor
                                </option>

                                <option value="Assistant Professor">
                                    Assistant Professor
                                </option>

                                <option value="Lecturer">
                                    Lecturer
                                </option>

                            </select>

                        </div>

                        <div class="d-flex gap-2">

                            <a
                                href="{{ url_for('faculty') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Faculty
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
