{% extends "base.html" %}

{% block title %}
Add Holiday
{% endblock %}

{% block content %}

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2>📅 Add Holiday</h2>

                    <p class="text-muted">
                        Add a college holiday
                    </p>

                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Holiday Date
                            </label>

                            <input
                                type="date"
                                name="date"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Holiday Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Example: Independence Day"
                                required
                            >

                        </div>


                        <div class="d-flex gap-2">

                            <a
                                href="{{ url_for('holidays') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Holiday
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
